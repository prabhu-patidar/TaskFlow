name: TaskFlow Overdue Reminders

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger overdue reminders
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-cron-secret: ${{ secrets.REMINDER_CRON_SECRET }}" \
            https://taskflow-api-vs2v.onrender.com/api/reminders/send
